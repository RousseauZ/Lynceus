# config.yaml — settings for the monitor itself.
# The list of machines lives in hosts.yaml.
#
# Copy this to config.yaml and fill in your own values.
# config.yaml is gitignored because it holds the webhook URL.

general:
  # Seconds between check rounds.
  interval: 60

  # How many consecutive failed checks before something counts as down.
  # At interval 60 and threshold 3 you get alerted after ~3 minutes.
  # Lower this and a rebooting container will trigger false alarms.
  failure_threshold: 3

  # While something stays down, repeat the alert every N hours so a message
  # missed at night is still visible in the morning.
  reminder_hours: 6

  # Where the last known state is kept, so restarting the service does not
  # replay alerts for things that were already down.
  state_file: /var/lib/heartbeat/state.json

wireguard:
  # Interface name, matching /etc/wireguard/<name>.conf
  interface: wg0

  # A handshake older than this many seconds counts as no connection.
  # WireGuard rehandshakes about every 2 minutes when there is traffic,
  # so anything under 120 will produce false alarms.
  handshake_max_age: 180

  # An address inside the tunnel, pinged before reading the handshake age.
  # WireGuard stays silent until there is traffic, so without this a healthy
  # tunnel can look stale simply because nothing was sent.
  # Use the tunnel IP of your WireGuard server.
  nudge_target: 10.10.0.1

discord:
  # Server settings -> Integrations -> Webhooks -> New Webhook -> Copy URL.
  # Treat this like a password: anyone holding it can post in your channel.
  webhook_url: https://discord.com/api/webhooks/changethis/to/your/webhook

  # Display name on the messages.
  username: Heartbeat
