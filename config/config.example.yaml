# config.yaml — settings for the monitor itself.
# The list of machines lives in hosts.yaml.
#
# Copy this to /etc/Lynceus/config.yaml and fill in your own values.
# The real file is never committed: it holds the webhook and broker password.

general:
  # Seconds between check rounds.
  interval: 60

  # How many consecutive failed checks before something counts as down.
  # At interval 60 and threshold 3 you get alerted after ~3 minutes.
  # Lower this and a rebooting container will trigger false alarms.
  failure_threshold: 3

  # While something stays down, repeat the alert every N hours so a message
  # missed at night is still visible in the morning.
  reminder_hours: 6

  # A gap longer than this between the last saved state and startup counts
  # as "the monitor was away" rather than a quick service restart.
  # Defaults to four missed cycles when omitted.
  startup_gap_threshold: 240

  state_file: /var/lib/Lynceus/state.json

wireguard:
  interface: wg0

  # A handshake older than this counts as no connection. WireGuard
  # rehandshakes about every 2 minutes when there is traffic, so anything
  # under 120 will produce false alarms.
  handshake_max_age: 180

  # An address inside the tunnel, pinged before reading the handshake age.
  # WireGuard stays silent until there is traffic, so without this a healthy
  # tunnel can look stale simply because nothing was sent.
  nudge_target: 10.0.0.1

discord:
  # Server settings -> Integrations -> Webhooks -> Copy URL.
  # Treat this like a password.
  webhook_url: https://discord.com/api/webhooks/CHANGE/ME
  username: Lynceus

mqtt:
  # Optional. Mirrors the monitor's own health to Home Assistant so you get
  # told when this Pi dies. Set enabled to false to run without it —
  # Discord alerting does not depend on the broker.
  enabled: true

  host: 192.168.1.110
  port: 1883
  username: Lynceus
  password: CHANGE_ME

  base_topic: Lynceus
  discovery_prefix: homeassistant
  node_id: Lynceus
