[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
# Everything on, then subtract. New rules in a future ruff arrive enabled
# rather than silently missing, which is the point of opt-out over opt-in.
select = ["ALL"]

ignore = [
    # --- Mutually exclusive pairs: ruff requires one of each to be off ---
    # D203/D211 disagree about a blank line before a class docstring; D211 (none) wins.
    "D203",
    # D212/D213 disagree about where a multi-line summary starts; D213 (second
    # line) wins, which is the style used throughout this file.
    "D212",

    # --- Conflicts with `ruff format` ---
    # The formatter decides trailing commas; leaving COM812 on fights it.
    "COM812",

    # --- Deliberate, with a reason ---
    # Every subprocess call here is a fixed argv list of a system tool (ping, wg,
    # vcgencmd) with no shell and no user-controlled executable. Absolute paths
    # differ between Raspberry Pi OS and Debian, so hard-coding them would be
    # more fragile than this is risky.
    "S603",
    "S607",
    # No copyright header on a personal repo.
    "CPY001",
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.format]
docstring-code-format = true
