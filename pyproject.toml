[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
# everything on, then subtract, so new ruff rules arrive enabled
select = ["ALL"]

ignore = [
    # D203/D211 and D212/D213 conflict, one of each has to go
    "D203",
    "D212",
    # the formatter decides trailing commas
    "COM812",
    # fixed argv lists of system tools, no shell, paths differ per distro
    "S603",
    "S607",
    # no copyright header on a personal repo
    "CPY001",
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.format]
docstring-code-format = true
