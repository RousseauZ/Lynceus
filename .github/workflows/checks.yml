name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q src/

      - name: Validate YAML config files
        run: |
          python -c "import yaml; yaml.safe_load(open('config/config.example.yaml')); print('config OK')"
          python -c "import yaml; yaml.safe_load(open('config/hosts.example.yaml')); print('hosts OK')"

      # pinned on purpose, a new ruff would break CI on untouched code
      - name: Lint
        run: |
          pip install ruff==0.16.5
          ruff check src/
          ruff format --check src/
